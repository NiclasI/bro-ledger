on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: mvn --batch-mode -Dapp.version=${GITHUB_REF_NAME#v} -Dlog.file.enabled=false -Ddebug.enabled=false -DskipTests package
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: target/bro-ledger.exe
