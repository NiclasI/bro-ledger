on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: mvn --batch-mode package
      - uses: softprops/action-gh-release@v2
        with:
          files: target/bro-ledger.exe
